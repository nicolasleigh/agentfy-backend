services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_secret
      POSTGRES_DB: ai_chat
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_chat"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      API_V1_PREFIX: /v1
      # 固定指向 compose 内的 db 服务（不使用宿主 .env 里的 localhost 值）
      DATABASE_URL: postgresql+asyncpg://app:app_secret@db:5432/ai_chat
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-at-least-32-bytes}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # LLM Provider: 默认连接宿主机 Ollama (Docker Desktop / Linux host-gateway)
      # 注意: 不要用 ${OLLAMA_BASE_URL:-...} 插值, 宿主 .env 里的 localhost 值在容器内不可用
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  db_data:
